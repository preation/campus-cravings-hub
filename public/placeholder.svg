<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f0f0f0" />

  <!-- Wall and window -->
  <rect x="0" y="0" width="600" height="400" fill="#e3f2fd" />
  <rect x="400" y="50" width="150" height="100" fill="#bbdefb" stroke="#90caf9" stroke-width="4" />

  <!-- Table -->
  <rect x="100" y="400" width="400" height="40" fill="#8d6e63" />

  <!-- Bowl -->
  <ellipse cx="300" cy="420" rx="70" ry="25" fill="#fff" stroke="#888" stroke-width="2" />

  <!-- Fruits/Vegetables in bowl -->
  <circle cx="280" cy="415" r="8" fill="green" />
  <circle cx="300" cy="412" r="9" fill="red" />
  <circle cx="315" cy="418" r="7" fill="orange" />
  <circle cx="290" cy="420" r="6" fill="yellowgreen" />
  <circle cx="310" cy="414" r="6" fill="tomato" />

  <!-- Student head -->
  <circle cx="300" cy="180" r="60" fill="#ffcc80" stroke="#444" stroke-width="3" />

  <!-- Eyes -->
  <circle cx="280" cy="170" r="8" fill="#000" />
  <circle cx="320" cy="170" r="8" fill="#000" />

  <!-- Mouth -->
  <path d="M 280 195 Q 300 215 320 195" stroke="#000" stroke-width="3" fill="none" />

  <!-- Hair -->
  <path d="M 240 160 Q 300 100 360 160 Q 300 110 240 160" fill="#5d4037" />

  <!-- Body -->
  <rect x="240" y="240" width="120" height="120" fill="#42a5f5" stroke="#1e88e5" stroke-width="3" rx="15" />

  <!-- Arms -->
  <line x1="240" y1="250" x2="180" y2="330" stroke="#ffcc80" stroke-width="15" />
  <line x1="360" y1="250" x2="420" y2="330" stroke="#ffcc80" stroke-width="15" />

  <!-- Spoon -->
  <line x1="420" y1="330" x2="440" y2="290" stroke="silver" stroke-width="5" />
  <circle cx="440" cy="290" r="5" fill="silver" />

  <!-- Food in spoon -->
  <circle cx="442" cy="288" r="4" fill="red" />
</svg>
